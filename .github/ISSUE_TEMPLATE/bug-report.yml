name: Bug report
description: Report reproducible behavior in a Five Acre Code public script.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include store names, customer or order data, credentials, session information, or sensitive screenshots. Use the private security process for vulnerabilities.
  - type: input
    id: script
    attributes:
      label: Script and version
      placeholder: Shopify Admin Tweaks 0.6.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and userscript manager
      placeholder: Chrome 142, Tampermonkey 5.x
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Shopify Admin area
      description: Describe the area without identifying the store.
      placeholder: Shopify Flow workflow editor
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, session data, store/customer identifiers, and protected business data.
          required: true
